# ZCU106 (ZU7EV) JTAG via onboard FTDI; AXI MEM-AP for mining control.
# This board's silicon reports PL tap IDCODE 0x14730093 (version-1), which the
# stock xilinx_zynqmp.cfg does not accept -> PS_TAPID must be overridden so the
# `ps` tap is recognised and the DAP-insertion setup event actually runs.
source [find interface/ftdi/digilent_jtag_smt2_nc.cfg]
ftdi device_desc "ZCU106 Eval Kit"
adapter speed 6000
bindto 127.0.0.1
gdb_port disabled
telnet_port disabled
debug_level 1

set PS_TAPID 0x14730093
source [find target/xilinx_zynqmp.cfg]
# Mining uses the AXI MEM-AP; ARM core examination is unnecessary.
targets uscale.axi
